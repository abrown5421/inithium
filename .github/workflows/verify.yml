# Runs the same verification as a hand-off (CLAUDE.md §6, decision 0103) on every pull request and on main.
name: Verify

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      NX_DAEMON: 'false'
      # Where mongodb-memory-server keeps its MongoDB binary, so the cache below can restore it.
      MONGOMS_DOWNLOAD_DIR: /home/runner/.cache/mongodb-binaries
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            core/package-lock.json
            docs/package-lock.json

      # The MongoDB binary the api tests run against (mongodb-memory-server), downloaded once and reused.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('core/package-lock.json') }}

      - name: Install core
        working-directory: core
        run: npm ci

      - name: Lint, type-check, test and build
        working-directory: core
        run: npx nx run-many -t lint typecheck test build

      - name: Install docs tooling
        working-directory: docs
        run: npm ci

      - name: Check the manual
        working-directory: docs
        run: npm run check
